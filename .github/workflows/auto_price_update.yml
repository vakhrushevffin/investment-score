name: Automatic Price Update (Test Branch)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/investment-score-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout test branch only
        uses: actions/checkout@v4
        with:
          ref: investment-score-v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'yfinance>=0.2.65,<2' 'exchange-calendars>=4.9,<5'
      - name: Record baseline
        run: |
          echo "BASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASE_HASH=$(sha256sum data/daily_prices.csv.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Prepare candidate
        run: |
          python scripts/safe_price_update.py --registry data/tickers.csv --archive data/daily_prices.csv.gz --output-dir /tmp/safe-price-update
      - name: Validate publication
        run: |
          python scripts/publish_price_update.py --registry data/tickers.csv --archive data/daily_prices.csv.gz --report /tmp/safe-price-update --expected-hash "$BASE_HASH"
      - name: Publish only new sessions
        run: |
          set -euo pipefail
          if [ "$(python -c 'import json; print(json.load(open("/tmp/safe-price-update/publication_summary.json"))["appended_rows"])')" = 0 ]; then
            echo 'No new sessions; no commit.'
            exit 0
          fi
          fail() { echo "::error::$1"; exit 1; }
          test "$(git branch --show-current)" = investment-score-v2 || fail "Wrong local branch"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT" || fail "Local HEAD changed"
          test "$(sha256sum data/daily_prices.csv.gz | cut -d' ' -f1)" = "$BASE_HASH" || fail "Baseline archive hash changed"
          git fetch origin investment-score-v2
          echo "Expected commit: $BASE_COMMIT"
          echo "Remote commit: $(git rev-parse FETCH_HEAD)"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_COMMIT" || fail "Remote branch changed; start a fresh run"
          status=$(git status --porcelain)
          if [ -n "$status" ]; then
            printf "%s\n" "$status"
            fail "Working tree is not clean"
          fi
          cp /tmp/safe-price-update/publish_daily_prices.csv.gz data/daily_prices.csv.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/daily_prices.csv.gz
          test "$(git diff --cached --name-only)" = data/daily_prices.csv.gz || fail "Unexpected staged files or no archive change"
          git commit -m 'Update validated daily prices'
          git push origin HEAD:refs/heads/investment-score-v2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-price-update-${{ github.run_number }}
          path: /tmp/safe-price-update/
          if-no-files-found: warn
          retention-days: 14
